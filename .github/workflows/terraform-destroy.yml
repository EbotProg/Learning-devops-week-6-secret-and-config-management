name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VERSION: 1.11.0

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-release
    if: inputs.confirm == 'destroy'
    strategy:
      matrix:
        environment: [dev, staging]
    environment: ${{ matrix.environment}}
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Init
        run: terraform init -input=false

      - name: Destroy
        run: terraform destroy -input=false -auto-approve
        env:
          TF_VAR_mongo_root_password: ${{ secrets.MONGO_ROOT_PASSWORD }}
          TF_VAR_parse_master_key: ${{ secrets.PARSE_MASTER_KEY }}
          TF_VAR_dashboard_password: ${{ secrets.DASHBOARD_PASSWORD }}
          TF_VAR_bastion_allowed_ip: ${{ vars.BASTION_ALLOWED_IP}}
